# Groups the auto-generated release notes by the labels used in this repository.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Automation and CI
      labels: [automation]
    - title: Images and features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Refactoring
      labels: [refactor]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
