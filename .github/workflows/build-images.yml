name: Build images

# Reusable multi-arch image build for docker-bake.hcl targets.
#
# Each architecture is built natively (ubuntu-24.04 / ubuntu-24.04-arm). When pushing, every
# build job records the digest of each image it pushed (bake --metadata-file); `verify` checks
# those digests (platform + constraints label) and `merge` creates the channel tag
# (<repo>:<channel>, plus :latest for stable, plus an immutable <channel>-YYYYMMDD tag) as a
# manifest list from the two digests, then signs it with cosign (keyless). Because verify and
# merge work on digests, two overlapping runs of the same channel can never be mixed, and a
# failed or missing arch never moves the tag the installer pulls.
#
# The build cache lives on GHCR (ghcr.io/openvoiceos/ovos-docker-cache), which has no pull-rate
# limits; Docker Hub only sees the image pushes themselves.

on:
  workflow_call:
    inputs:
      channel:
        description: OVOS channel (alpha, testing, stable) — used as image tag and constraints file
        type: string
        required: true
      targets:
        description: Space-separated bake targets or groups (default, stack, services, skills, guis, <target>)
        type: string
        default: default
      ovos_releases_ref:
        description: Git ref of OpenVoiceOS/ovos-releases to take constraints-<channel>.txt from
        type: string
        default: main
      push:
        description: Push the images to the registry
        type: boolean
        default: false
      registry:
        type: string
        default: docker.io/smartgic
      uv_prerelease:
        description: "uv --prerelease mode; auto = allow for alpha, if-necessary-or-explicit for testing/stable"
        type: string
        default: auto
      immutable_tag:
        description: Also tag the merged image <channel>-YYYYMMDD
        type: boolean
        default: true
      sign:
        description: Sign the merged images with cosign (keyless, GitHub OIDC)
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      channel:
        description: OVOS channel
        type: choice
        options: [alpha, testing, stable]
        default: alpha
      targets:
        description: Space-separated bake targets or groups
        type: string
        default: default
      ovos_releases_ref:
        description: ovos-releases git ref for the constraints file
        type: string
        default: main
      push:
        description: Push to the registry
        type: boolean
        default: false
      registry:
        description: Registry
        type: string
        default: docker.io/smartgic
      uv_prerelease:
        description: "uv --prerelease mode (auto = allow for alpha, if-necessary-or-explicit otherwise)"
        type: string
        default: auto
      immutable_tag:
        description: Also tag the merged image <channel>-YYYYMMDD
        type: boolean
        default: true
      sign:
        description: Sign the merged images with cosign
        type: boolean
        default: true

permissions:
  contents: write   # build-state branch (what each channel was built from)
  packages: write   # GHCR build cache
  id-token: write   # cosign keyless signing

jobs:
  resolve:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    outputs:
      ovos_releases_sha: ${{ steps.ref.outputs.sha }}
      targets: ${{ steps.targets.outputs.list }}
      images: ${{ steps.targets.outputs.images }}
      build_date: ${{ steps.meta.outputs.build_date }}
      date_tag: ${{ steps.meta.outputs.date_tag }}
      uv_prerelease: ${{ steps.pre.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve ovos-releases ref to a commit
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ovos_releases_ref }}
        run: |
          sha=$(gh api "repos/OpenVoiceOS/ovos-releases/commits/${REF}" --jq .sha)
          echo "ovos-releases ${REF} -> ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Expand bake targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          REGISTRY: ${{ inputs.registry }}
          TAG: ${{ inputs.channel }}
        run: |
          # shellcheck disable=SC2086
          docker buildx bake --print $TARGETS > bake.json
          # Requested targets with groups expanded, starting from the TARGETS input itself (each word is a
          # group or a target; groups may nest). `.target` also lists targets pulled in only as build
          # contexts (e.g. base for messagebus); bake builds those but does not push them, so
          # verify/merge must only look at what was actually requested.
          # shellcheck disable=SC2086
          printf '%s\n' $TARGETS | jq -R . | jq -sc '.' > roots.json
          jq -c --slurpfile roots roots.json '. as $b
                 | def expand: if $b.group[.] != null then ($b.group[.].targets[] | expand) else . end;
                 [ $roots[0][] | expand ] | unique' bake.json | tee targets.json
          # every resolved name must be a real target
          jq -e --slurpfile t targets.json '($t[0] - (.target | keys)) == []' bake.json > /dev/null \
            || { echo "::error::unknown target(s): $(jq -c --slurpfile t targets.json '$t[0] - (.target | keys)' bake.json)"; exit 1; }
          # target -> repository (tag stripped)
          jq -c --slurpfile t targets.json '.target | with_entries(select(.key as $k | $t[0] | index($k))) | with_entries(.value = (.value.tags[0] | split(":")[0]))' bake.json | tee images.json
          echo "list=$(cat targets.json)" >> "$GITHUB_OUTPUT"
          echo "images=$(cat images.json)" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_date=${now}" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Effective prerelease mode
        id: pre
        env:
          MODE: ${{ inputs.uv_prerelease }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          # constraints-alpha.txt pins pre-releases (>=x.y.za1); testing/stable are stable version ranges,
          # so pre-releases must not be pulled into them.
          if [ "$MODE" = "auto" ]; then
            case "$CHANNEL" in
              alpha) MODE=allow ;;
              *)     MODE=if-necessary-or-explicit ;;
            esac
          fi
          echo "channel=$CHANNEL -> uv --prerelease=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    concurrency:
      group: build-images-${{ inputs.channel }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Registry credentials available?
        id: creds
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$U" ] && [ -n "$T" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refuse to push without credentials
        if: inputs.push && steps.creds.outputs.available != 'true'
        run: |
          echo "::error::push=true but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set"
          exit 1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR (build cache)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bake ${{ inputs.targets }} for ${{ matrix.platform }}
        env:
          REGISTRY: ${{ inputs.registry }}
          # arch-suffixed tag; the channel tag is created by the merge job from digests
          TAG: ${{ inputs.channel }}-${{ matrix.arch }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.channel }}
          UV_PRERELEASE: ${{ needs.resolve.outputs.uv_prerelease }}
          OVOS_RELEASES_REF: ${{ needs.resolve.outputs.ovos_releases_sha }}
          BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
          GIT_SHA: ${{ github.sha }}
          # export the build cache to GHCR unless this is a fork PR (read-only token)
          CACHE_TO: ${{ github.event.pull_request.head.repo.fork == true && '' || 'max' }}
          TARGETS: ${{ inputs.targets }}
          PLATFORM: ${{ matrix.platform }}
          PUSH: ${{ inputs.push }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -x
          args=(--set "*.platform=${PLATFORM}" --metadata-file "bake-meta-${ARCH}.json")
          if [ "$PUSH" = "true" ]; then args+=(--push); fi
          # shellcheck disable=SC2086
          docker buildx bake $TARGETS "${args[@]}"

      - name: Upload bake metadata
        if: inputs.push
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bake-meta-${{ matrix.arch }}
          path: bake-meta-${{ matrix.arch }}.json
          retention-days: 7

  verify:
    name: Verify pushed images
    needs: [resolve, build]
    if: inputs.push
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: bake-meta-*
          merge-multiple: true

      - name: Check every pushed digest matches its platform and records the constraints ref
        env:
          TARGETS: ${{ needs.resolve.outputs.targets }}
          IMAGES: ${{ needs.resolve.outputs.images }}
          EXPECTED_REF: ${{ needs.resolve.outputs.ovos_releases_sha }}
        run: |
          set +e   # report every bad image, then fail once at the end
          fail=0
          for target in $(echo "$TARGETS" | jq -r '.[]'); do
            repo=$(echo "$IMAGES" | jq -r --arg t "$target" '.[$t]')
            for arch in amd64 arm64; do
              digest=$(jq -r --arg t "$target" '.[$t]["containerimage.digest"] // empty' "bake-meta-${arch}.json")
              if [ -z "$digest" ]; then echo "::error::${target}/${arch}: no digest in bake metadata"; fail=1; continue; fi
              ref="${repo}@${digest}"
              if ! docker buildx imagetools inspect "$ref" --format '{{json .Image}}' > image.json 2> err.txt; then
                echo "::error::${ref}: $(cat err.txt)"; fail=1; continue
              fi
              if python3 - "$ref" "$arch" "$EXPECTED_REF" <<'PY'
          import json, sys
          ref, arch, expected = sys.argv[1:]
          obj = json.load(open("image.json"))
          # single image -> config object; image index (attestations) -> {platform: config}
          img = obj if "config" in obj else next(iter(obj.values()))
          got_arch = img.get("architecture")
          got_ref = (img.get("config") or {}).get("Labels", {}).get("io.openvoiceos.constraints.ref")
          ok = got_arch == arch and got_ref == expected
          print(f"{'OK ' if ok else 'BAD'} {ref}: architecture={got_arch} constraints.ref={got_ref}")
          sys.exit(0 if ok else 1)
          PY
              then :; else fail=1; fi
            done
          done
          exit $fail

  merge:
    name: Create channel manifests
    needs: [resolve, build, verify]
    if: inputs.push
    runs-on: ubuntu-24.04
    concurrency:
      group: merge-images-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: bake-meta-*
          merge-multiple: true

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Create manifest lists from the verified digests
        env:
          TARGETS: ${{ inputs.targets }}
          TARGET_LIST: ${{ needs.resolve.outputs.targets }}
          IMAGES: ${{ needs.resolve.outputs.images }}
          REGISTRY: ${{ inputs.registry }}
          TAG: ${{ inputs.channel }}
          CHANNEL: ${{ inputs.channel }}
          DATE_TAG: ${{ needs.resolve.outputs.date_tag }}
          IMMUTABLE: ${{ inputs.immutable_tag }}
          SIGN: ${{ inputs.sign }}
        run: |
          # The bake file decides the channel tags (<repo>:<channel>, plus :latest when stable).
          # shellcheck disable=SC2086
          docker buildx bake --print $TARGETS > bake.json
          echo "[]" > entries.json
          for target in $(echo "$TARGET_LIST" | jq -r '.[]'); do
            repo=$(echo "$IMAGES" | jq -r --arg t "$target" '.[$t]')
            mapfile -t tags < <(jq -r --arg t "$target" '.target[$t].tags[]' bake.json)
            if [ "$IMMUTABLE" = "true" ]; then tags+=("${repo}:${CHANNEL}-${DATE_TAG}"); fi
            src=()
            for arch in amd64 arm64; do
              src+=("${repo}@$(jq -r --arg t "$target" '.[$t]["containerimage.digest"]' "bake-meta-${arch}.json")")
            done
            args=()
            for t in "${tags[@]}"; do args+=(-t "$t"); done
            echo "==> ${target}: ${tags[*]}"
            printf '      <- %s\n' "${src[@]}"
            docker buildx imagetools create "${args[@]}" "${src[@]}"
            digest=$(docker buildx imagetools inspect "${tags[0]}" --format '{{.Manifest.Digest}}')
            if [ "$SIGN" = "true" ]; then
              cosign sign --yes "${repo}@${digest}"
            fi
            jq --arg t "$target" --arg r "$repo" --arg d "$digest" --arg a "${src[0]#*@}" \
               '. + [{target: $t, repo: $r, digest: $d, amd64_digest: $a}]' entries.json > entries.tmp && mv entries.tmp entries.json
          done

      - name: Record build state
        env:
          CHANNEL: ${{ inputs.channel }}
          OVOS_RELEASES_SHA: ${{ needs.resolve.outputs.ovos_releases_sha }}
        run: |
          # state/<channel>.json on the build-state branch: repo, digest, constraints ref and the Python
          # packages (from the SBOM) of every image just published. scripts/affected.py reads it to decide
          # what a constraints change requires rebuilding, without any registry request.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin build-state > /dev/null 2>&1; then
            git fetch --depth=1 origin build-state
            git worktree add state-wt FETCH_HEAD
            git -C state-wt checkout -q -B build-state
          else
            git worktree add --detach state-wt
            git -C state-wt checkout -q --orphan build-state
            git -C state-wt rm -rfq .
            printf '# build-state\n\nWhat each channel was last built from. Written by build-images.yml, read by scripts/affected.py.\n' > state-wt/README.md
          fi
          mkdir -p state-wt/state
          python3 scripts/ci/record-state.py "state-wt/state/${CHANNEL}.json" "$CHANNEL" "$OVOS_RELEASES_SHA" entries.json
          git -C state-wt add -A
          git -C state-wt commit -qm "state(${CHANNEL}): $(jq length entries.json) image(s) from ovos-releases@${OVOS_RELEASES_SHA:0:7}"
          for attempt in 1 2 3 4 5; do
            git -C state-wt push origin build-state && break
            echo "push rejected (attempt ${attempt}); rebasing on the current build-state"
            git -C state-wt fetch origin build-state
            git -C state-wt rebase FETCH_HEAD
          done

      - name: Summary
        env:
          TARGET_LIST: ${{ needs.resolve.outputs.targets }}
          IMAGES: ${{ needs.resolve.outputs.images }}
          CHANNEL: ${{ inputs.channel }}
          SIGN: ${{ inputs.sign }}
        run: |
          {
            echo "### Published \`${CHANNEL}\` images"
            echo
            echo "| Image | Platforms | Digest | Signed |"
            echo "|---|---|---|---|"
            for target in $(echo "$TARGET_LIST" | jq -r '.[]'); do
              repo=$(echo "$IMAGES" | jq -r --arg t "$target" '.[$t]')
              ref="${repo}:${CHANNEL}"
              p=$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')
              d=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
              s=$([ "$SIGN" = "true" ] && echo "cosign" || echo "no")
              echo "| \`$ref\` | $p | \`${d:0:19}…\` | $s |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
