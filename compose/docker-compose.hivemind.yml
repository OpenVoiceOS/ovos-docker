---
x-podman: &podman
  userns_mode: keep-id
  # A minimal init (PID 1) reaps the children a service may spawn and forwards signals.
  init: true
  security_opt:
    - "label=disable"

# Services that only talk to the message bus need no Linux capability at all:
# drop every capability and forbid privilege escalation.
x-hardened: &hardened
  userns_mode: keep-id
  init: true
  cap_drop:
    - ALL
  security_opt:
    - "label=disable"
    - "no-new-privileges:true"

x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m
    # 3 x 10 MB per container: enough history to debug, bounded on SD cards (35 containers ≈ 1 GB max)
    max-size: "10m"
    max-file: "3"

x-common-environment: &common-environment
  TZ: ${TZ:-UTC}

x-light-resource-limits: &light-resource-limits
  deploy:
    resources:
      limits:
        memory: ${LIGHT_MEMORY_LIMIT:-512M}
      reservations:
        memory: 64M

x-hivemind-base: &hivemind-base
  <<: [*hardened, *light-resource-limits]
  restart: unless-stopped
  logging: *default-logging
  pull_policy: ${PULL_POLICY:-always}
  tty: true
  environment:
    <<: *common-environment
  network_mode: host
  volumes:
    - ${HIVEMIND_CONFIG_FOLDER}:/home/${HIVEMIND_USER}/.config/hivemind:z
    - ${HIVEMIND_SHARE_FOLDER}:/home/${HIVEMIND_USER}/.local/share/hivemind:z
  healthcheck:
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s

services:
  hivemind_listener:
    <<: *hivemind-base
    container_name: hivemind_listener
    hostname: hivemind_listener
    image: docker.io/smartgic/hivemind-listener:${VERSION}
    depends_on:
      ovos_core:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "-f", "hivemind-listener"]

  hivemind_cli:
    <<: *hivemind-base
    container_name: hivemind_cli
    hostname: hivemind_cli
    image: docker.io/smartgic/hivemind-cli:${VERSION}
    depends_on:
      hivemind_listener:
        condition: service_started
