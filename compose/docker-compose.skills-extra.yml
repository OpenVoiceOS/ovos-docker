---
x-podman: &podman
  userns_mode: keep-id
  # A minimal init (PID 1) reaps the children a service may spawn and forwards signals.
  init: true
  security_opt:
    - "label=disable"

# Services that only talk to the message bus need no Linux capability at all:
# drop every capability and forbid privilege escalation.
x-hardened: &hardened
  userns_mode: keep-id
  init: true
  cap_drop:
    - ALL
  security_opt:
    - "label=disable"
    - "no-new-privileges:true"

x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m
    # 3 x 10 MB per container: enough history to debug, bounded on SD cards (35 containers ≈ 1 GB max)
    max-size: "10m"
    max-file: "3"

x-common-environment: &common-environment
  TZ: ${TZ:-UTC}

x-skill-resource-limits: &skill-resource-limits
  deploy:
    resources:
      limits:
        memory: ${LIGHT_MEMORY_LIMIT:-512M}
      reservations:
        memory: 64M

x-skill-base: &skill-base
  # a skill is the first thing the kernel should kill under memory pressure, the bus the last
  oom_score_adj: 300
  <<: [*hardened, *skill-resource-limits]
  restart: unless-stopped
  logging: *default-logging
  pull_policy: ${PULL_POLICY:-always}
  environment:
    <<: *common-environment
  network_mode: host
  volumes:
    - ${OVOS_CONFIG_FOLDER}:/home/${OVOS_USER}/.config/mycroft
    - ${TMP_FOLDER}:/tmp/mycroft
  depends_on:
    ovos_core:
      condition: service_started

volumes:
  ovos_nltk:
    name: ovos_nltk
    driver: local

services:
  ovos_skill_wolfie:
    <<: *skill-base
    container_name: ovos_skill_wolfie
    hostname: ovos_skill_wolfie
    image: docker.io/smartgic/ovos-skill-wolfie:${VERSION}

  ovos_skill_jokes:
    <<: *skill-base
    container_name: ovos_skill_jokes
    hostname: ovos_skill_jokes
    image: docker.io/smartgic/ovos-skill-jokes:${VERSION}

  ovos_skill_easter_eggs:
    <<: *skill-base
    container_name: ovos_skill_easter_eggs
    hostname: ovos_skill_easter_eggs
    image: docker.io/smartgic/ovos-skill-easter-eggs:${VERSION}

  ovos_skill_parrot:
    <<: *skill-base
    container_name: ovos_skill_parrot
    hostname: ovos_skill_parrot
    image: docker.io/smartgic/ovos-skill-parrot:${VERSION}

  ovos_skill_randomness:
    <<: *skill-base
    container_name: ovos_skill_randomness
    hostname: ovos_skill_randomness
    image: docker.io/smartgic/ovos-skill-randomness:${VERSION}

  ovos_skill_camera:
    <<: *skill-base
    container_name: ovos_skill_camera
    hostname: ovos_skill_camera
    image: docker.io/smartgic/ovos-skill-camera:${VERSION}

  ovos_skill_wikihow:
    <<: *skill-base
    container_name: ovos_skill_wikihow
    hostname: ovos_skill_wikihow
    image: docker.io/smartgic/ovos-skill-wikihow:${VERSION}

  ovos_skill_homeassistant:
    <<: *skill-base
    container_name: ovos_skill_homeassistant
    hostname: ovos_skill_homeassistant
    image: docker.io/smartgic/ovos-skill-homeassistant:${VERSION}
