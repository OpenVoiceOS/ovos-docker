---
# Raspberry Pi specific overrides with optimized resource limits for ARM hardware

x-pi-resource-limits: &pi-resource-limits
  deploy:
    resources:
      limits:
        memory: ${STANDARD_MEMORY_LIMIT:-512M}
      reservations:
        memory: 64M

# See x-listener-resource-limits in docker-compose.yml: on-device speech needs more than
# the Pi's standard limit, and only when LISTENER/AUDIO_MEMORY_LIMIT ask for it.
x-pi-listener-resource-limits: &pi-listener-resource-limits
  deploy:
    resources:
      limits:
        memory: ${LISTENER_MEMORY_LIMIT:-${STANDARD_MEMORY_LIMIT:-512M}}
      reservations:
        memory: 64M

x-pi-audio-resource-limits: &pi-audio-resource-limits
  deploy:
    resources:
      limits:
        memory: ${AUDIO_MEMORY_LIMIT:-${STANDARD_MEMORY_LIMIT:-512M}}
      reservations:
        memory: 64M

x-pi-core-resource-limits: &pi-core-resource-limits
  deploy:
    resources:
      limits:
        memory: ${CORE_MEMORY_LIMIT:-1G}
      reservations:
        memory: 128M
        cpus: "0.2"

x-pi-light-resource-limits: &pi-light-resource-limits
  deploy:
    resources:
      limits:
        memory: ${LIGHT_MEMORY_LIMIT:-256M}
      reservations:
        memory: 32M

services:
  ovos_messagebus:
    <<: *pi-resource-limits
    healthcheck:
      disable: true

  ovos_phal:
    <<: *pi-resource-limits
    healthcheck:
      disable: true
    group_add:
      - "${GPIO_GID}"
      - "${I2C_GID}"
      - "${SPI_GID}"

  ovos_phal_admin:
    <<: *pi-light-resource-limits
    healthcheck:
      disable: true
    group_add:
      - "${GPIO_GID}"
      - "${I2C_GID}"
      - "${SPI_GID}"

  ovos_listener:
    <<: *pi-listener-resource-limits
    healthcheck:
      disable: true

  ovos_audio:
    <<: *pi-audio-resource-limits
    healthcheck:
      disable: true

  ovos_core:
    <<: *pi-core-resource-limits
    healthcheck:
      disable: true
    group_add:
      - "${GPIO_GID}"
      - "${I2C_GID}"
      - "${SPI_GID}"

  ovos_cli:
    <<: *pi-light-resource-limits
    healthcheck:
      disable: true
